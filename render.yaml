services:
  - type: web
    name: group-manager-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: TOKEN
        sync: false
      - key: OWNER_ID
        value: "8947599931"
      - key: PORT
        value: "8080"
      - key: PYTHON_VERSION
        value: "3.12.9"
    plan: free
